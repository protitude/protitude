<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
        #energy {
          width: 200px;
          height: 30px;
          border: 2px solid #000;
          border-radius: 5px;
          position: relative;
          font-family: Arial, sans-serif;
          font-size: 16px;
          text-align: center;
          line-height: 30px;
          color: #fff;
        }
        #energy::before {
          content: '';
          background-color: #555;
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          right: 0;
          z-index: -2;
        }
        #energy::after {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          background-color: #4caf50;
          border-radius: 5px 0 0 5px;
          z-index: -1;
          animation: fillBar 2s ease-out forwards;
        }
        @keyframes fillBar {
          from { width: 0%; }
          to { width: 50%; }
        }
			</style>
      <div id="energy">50%</div>
		</div>
	</foreignObject>
</svg>
