name: Update Swim Stats

on:
  schedule:
    - cron: '30 5 * * *'  # Run daily at 10:30pm MST (5:30am UTC next day)
  workflow_dispatch:  # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Garmin .env file
        run: |
          echo "$GARMIN_AUTH" > garmin/.env
          ls -al garmin
        env:
          GARMIN_AUTH: ${{ secrets.GARMIN_AUTH }}

      - name: Install dependencies
        run: |
          cd garmin
          npm install

      - name: Run swim stats update script
        run: bash update_swim_stats.sh
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}

      - name: Run swim graph update script (Mondays only)
        if: github.event.schedule == '0 5 * * *' && format('{0}', github.event.repository.updated_at) != '' || github.event_name == 'workflow_dispatch'
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          # Check if today is Monday (1 = Monday in date command)
          if [ $(date +%u) -eq 1 ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Running swim graph update (Monday or manual trigger)..."
            bash update_swim_graph.sh
          else
            echo "Skipping swim graph update (not Monday)"
          fi

      - name: Remove .env file
        if: always()
        run: rm -f garmin/.env

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md swim-graph.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update swim stats" && git push)
